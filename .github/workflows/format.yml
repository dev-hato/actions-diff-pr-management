---
name: format
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  merge_group:
# 書き込みにはGitHub Appのトークンを使うため、GITHUB_TOKENは読み取り権限のみとする
permissions:
  contents: read
jobs:
  format:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        with:
          cache: npm
          node-version-file: .node-version
      - if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      # 書き込み権限のあるジョブで動くため、依存パッケージのスクリプトは実行しない
      - if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: npm install --ignore-scripts
      - name: Get inputs markdown
        id: get_inputs_markdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        env:
          HEAD_REF: ${{github.event.pull_request.head.ref || github.head_ref}}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          result-encoding: string
          script: |
            const {tsImport} = require('tsx/esm/api')
            const {default: {script}} = await tsImport(
              './scripts/format/format/get_inputs_markdown.ts',
              process.env.GITHUB_WORKSPACE + '/'
            )
            return script()
      - env:
          INPUTS: ${{steps.get_inputs_markdown.outputs.result}}
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: bash "${GITHUB_WORKSPACE}/scripts/format/format/update_readme.sh"
      # .rulesync/ のルールから、各AIエージェント向けのファイルを生成する
      - run: npx --no-install rulesync generate
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
      - run: npx prettier --write .
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
      - run: tsc
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
      # 修正PRの操作はforkからでないpull_requestとpushでのみ行う。それ以外では差分の検証のみを行うため、書き込み用のトークンを発行しない
      # forkからのPRでは、本Actionsが修正PRを操作せずに差分を検証する
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push'
        with:
          client-id: ${{ secrets.PROJECT_AUTOMATION_APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: $/
        with:
          github-token: ${{ steps.generate_token.outputs.token || github.token }}
          branch-name-prefix: fix-format
          pr-title-prefix: format修正
          pr-description-prefix: formatを修正しました。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
