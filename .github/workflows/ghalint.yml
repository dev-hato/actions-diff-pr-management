---
name: ghalint
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ghalint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Goモジュールを取得する前に、Takumi Guard経由で取得するようGOPROXYを設定する
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
      - name: Lint workflows and action definitions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          result=0
          go tool ghalint --log-color never run || result=1

          action_files_path="${RUNNER_TEMP}/ghalint-action-files"
          git ls-files -z -- 'action.yml' 'action.yaml' '**/action.yml' '**/action.yaml' > "$action_files_path"
          action_files=()
          while IFS= read -r -d '' action_file; do
            action_files+=("$action_file")
          done < "$action_files_path"
          printf 'Action definitions: %d\n' "${#action_files[@]}"
          if (( ${#action_files[@]} > 0 )); then
            go tool ghalint --log-color never run-action -- "${action_files[@]}" || result=1
          fi

          exit "$result"
